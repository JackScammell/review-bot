# Copy to .github/workflows/review-bot.yml in each repo.
# Triggers: PR opened or marked ready (not drafts, not every push),
# and /review or /council comments from people with write access.
name: Review bot

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: review-bot-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Cheap pre-filter so ordinary comments don't start a runner.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/council')))
    uses: JackScammell/review-bot/.github/workflows/review.yml@v1
    # Named explicitly: 'secrets: inherit' does not pass secrets to a workflow owned by another account.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
