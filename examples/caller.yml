# Copy to .github/workflows/review-bot.yml in each repo.
# Triggers: PR opened, reopened or marked ready (not drafts, not every push), and
# /review or /council comments from owners, organisation members and collaborators.
name: Review bot

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write   # only for the "budget nearly used" comment

concurrency:
  group: review-bot-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Cheap pre-filter so ordinary comments don't start a runner.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/council')))
    uses: JackScammell/review-bot/.github/workflows/review.yml@v1
    # Named explicitly: 'secrets: inherit' does not pass secrets to a workflow owned by another account.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
