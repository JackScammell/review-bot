# Reusable PR review workflow. Repos call it with a small caller file
# (see examples/caller.yml). One shared monthly budget across every repo.
name: review-bot

on:
  workflow_call:
    inputs:
      bot_ref:
        description: "Ref of JackScammell/review-bot to load scripts and prompts from"
        type: string
        default: "v1"
      monthly_budget_usd:
        description: "Soft budget the guard paces against (keep below the Console hard cap)"
        type: number
        default: 180
      budget_gist_id:
        description: "Gist holding ledger.json (shared by all repos). Empty = no ledger; the Console spend limit is the only cap"
        type: string
        default: ""
      single_model:
        type: string
        default: "claude-sonnet-5-5"
      council_model:
        description: "Model for every council member and the synthesis"
        type: string
        default: "claude-sonnet-5-5"
      council_ref:
        description: "Ref of JackScammell/Parliament-Of-Chaos whose reviewer prompts the council uses"
        type: string
        default: "main"
      large_pr_lines:
        description: "Changed lines (excluding lockfiles) that count as a large PR"
        type: number
        default: 300
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      REVIEW_BOT_LEDGER_TOKEN:
        description: "Fine-grained token that can read and write the ledger gist (only with budget_gist_id)"
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      pr: ${{ steps.plan.outputs.pr }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JackScammell/review-bot
          ref: ${{ inputs.bot_ref }}
          path: .review-bot
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_TOKEN: ${{ secrets.REVIEW_BOT_LEDGER_TOKEN }}
          GIST_ID: ${{ inputs.budget_gist_id }}
          BUDGET: ${{ inputs.monthly_budget_usd }}
          LARGE_PR_LINES: ${{ inputs.large_pr_lines }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: bash .review-bot/scripts/plan.sh

  skipped:
    needs: plan
    if: needs.plan.outputs.tier == 'budget-hold'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ needs.plan.outputs.pr }}" --repo "${{ github.repository }}" \
            --body "Review bot: this month's review budget is nearly used, so no review this time. ${{ needs.plan.outputs.reason }}"

  review:
    needs: plan
    if: needs.plan.outputs.tier == 'single' || needs.plan.outputs.tier == 'council'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.plan.outputs.tier == 'council' && 20 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.plan.outputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false   # no token left in the workspace
      - uses: actions/checkout@v4
        with:
          repository: JackScammell/review-bot
          ref: ${{ inputs.bot_ref }}
          path: .review-bot
          persist-credentials: false
      - if: needs.plan.outputs.tier == 'council'
        uses: actions/checkout@v4
        with:
          repository: JackScammell/Parliament-Of-Chaos
          ref: ${{ inputs.council_ref }}
          path: .council
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet anthropic

      - id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ needs.plan.outputs.tier }}
          PR: ${{ needs.plan.outputs.pr }}
          REPO: ${{ github.repository }}
          SINGLE_MODEL: ${{ inputs.single_model }}
          COUNCIL_MODEL: ${{ inputs.council_model }}
        run: python .review-bot/scripts/review_bot.py

      - name: Record cost in the shared ledger
        if: always()
        env:
          LEDGER_TOKEN: ${{ secrets.REVIEW_BOT_LEDGER_TOKEN }}
          GIST_ID: ${{ inputs.budget_gist_id }}
          TIER: ${{ needs.plan.outputs.tier }}
          PR: ${{ needs.plan.outputs.pr }}
          REPO: ${{ github.repository }}
          COST_USD: ${{ steps.review.outputs.cost_usd }}
        run: bash .review-bot/scripts/record-cost.sh
