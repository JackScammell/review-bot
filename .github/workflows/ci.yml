# CI for this repo: lints the scripts and workflows and runs the tests.
# It needs no secrets and never calls the Claude API. Keep it that way: it must not
# gain secrets, write permissions or a pull_request_target trigger.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # When bumping, take the SHA-256 from that release's actionlint_<version>_checksums.txt.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x --source-path=SCRIPTDIR scripts/*.sh tests/*.sh
      - name: Install actionlint (release tarball, checksum verified)
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml examples/*.yml'

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"   # same as the review workflow
      - name: Python compiles
        run: python -m py_compile scripts/review_bot.py
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell script tests
        run: bash tests/test_scripts.sh
